name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [base-image-updated]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This image is ~16 GB, and `load: true` stores it twice: once in the
      # BuildKit cache and again in the Docker daemon. That does not fit beside
      # the SDKs a hosted runner ships with, and the build dies with "no space
      # left on device" while importing. None of these are used here.
      - name: Free up runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint shell and JSON assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning cmake/build-cmsis-dsp.sh scripts/*.sh \
                                dev-doctor-checks/*.sh tests/*.sh
          jq -e . profile.json > /dev/null
          jq -e . claude-embedded-arm/settings.layer.json > /dev/null
          echo "shell + JSON assets OK"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first — nothing is published unless the smoke tests pass.
      # The smoke test cross-compiles a real Cortex-M33 (STM32WBA65) firmware,
      # so a green run means STM32 development in this image actually works.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dev-embedded-arm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-embedded-arm:ci bash /tests/smoke.sh

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell embedded-base its image is verified downstream, so :stable can move.
      - name: Report upstream
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          gh api repos/WojtaCZ/docker-dev-embedded-base/dispatches \
             -f event_type=downstream-verified
